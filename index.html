<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#1e293b"
  >

  <title>사주그랩 백서 RAG 챗봇</title>

  <style>
    :root {
      --header-height: 64px;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --header: #1e293b;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --background: #f4f6f8;
      --white: #ffffff;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        'Segoe UI',
        'Apple SD Gothic Neo',
        'Noto Sans KR',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--text);

      display: flex;
      flex-direction: column;

      min-height: 100dvh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      width: 100%;
      min-height: var(--header-height);

      flex-shrink: 0;

      background: var(--header);
      color: white;

      padding:
        max(10px, env(safe-area-inset-top))
        18px
        10px
        18px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;
    }

    header h1 {
      min-width: 0;

      font-size: 1.15rem;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-controls {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .model-badge {
      max-width: 180px;

      font-size: 0.75rem;
      color: #cbd5e1;

      background: #334155;

      padding: 5px 10px;

      border-radius: 999px;

      border: 1px solid #475569;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      flex-shrink: 0;

      width: 38px;
      height: 38px;

      background: transparent;
      border: none;

      color: white;

      font-size: 1.35rem;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 8px;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    /* =========================================================
       CHAT
       ========================================================= */

    #chat-container {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 15px;

      scroll-behavior: smooth;
    }

    .message {
      width: fit-content;
      max-width: min(85%, 900px);

      padding: 12px 16px;

      border-radius: 12px;

      line-height: 1.6;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;

      background: var(--primary);
      color: white;

      border-bottom-right-radius: 2px;
    }

    .ai {
      align-self: flex-start;

      background: var(--white);
      color: var(--text);

      border-bottom-left-radius: 2px;

      border: 1px solid var(--border);
    }

    /* =========================================================
       RESPONSE META
       ========================================================= */

    .message-meta {
      margin-top: 10px;

      padding-top: 8px;

      border-top:
        1px solid var(--border);

      font-size: 0.75rem;
      line-height: 1.45;

      color: var(--muted);
    }

    /* =========================================================
       TIMING
       ========================================================= */

    .timing-box {
      margin-top: 10px;

      padding-top: 9px;

      border-top:
        1px solid var(--border);

      font-size: 0.75rem;

      color: #475569;

      font-variant-numeric: tabular-nums;

      line-height: 1.65;
    }

    .timing-row {
      display: flex;

      justify-content: space-between;

      gap: 20px;

      min-width: 190px;
    }

    .timing-label {
      color: #64748b;
    }

    .timing-value {
      font-weight: 700;

      color: #334155;

      white-space: nowrap;
    }

    .response-timer {
      display: inline-block;

      margin-top: 8px;

      padding: 4px 8px;

      border-radius: 999px;

      background: #eff6ff;

      color: #1d4ed8;

      font-size: 0.72rem;

      font-variant-numeric: tabular-nums;

      border:
        1px solid #dbeafe;
    }

    .response-timer.loading {
      background: #f8fafc;

      color: #64748b;

      border-color: #e2e8f0;
    }

    .response-timer.error {
      background: #fef2f2;

      color: var(--danger);

      border-color: #fecaca;
    }

    /* =========================================================
       SOURCES
       ========================================================= */

    .sources {
      margin-top: 8px;

      display: flex;
      flex-direction: column;

      gap: 6px;

      max-width: 100%;
    }

    .source-item {
      width: 100%;

      background: #f8fafc;

      border:
        1px solid var(--border);

      border-radius: 6px;

      padding: 8px 10px;

      font-size: 0.75rem;

      color: #475569;

      overflow: hidden;
    }

    .source-item summary {
      cursor: pointer;

      font-weight: 600;

      line-height: 1.4;

      overflow-wrap: anywhere;
    }

    .source-text {
      margin-top: 8px;

      line-height: 1.5;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* =========================================================
       INPUT
       ========================================================= */

    #input-container {
      width: 100%;

      flex-shrink: 0;

      padding:
        12px
        18px
        calc(12px + env(safe-area-inset-bottom))
        18px;

      background: var(--white);

      display: flex;
      align-items: center;

      gap: 10px;

      border-top:
        1px solid var(--border);
    }

    input[type="text"] {
      min-width: 0;

      flex: 1;

      height: 46px;

      padding:
        0
        12px;

      border:
        1px solid #cbd5e1;

      border-radius: 9px;

      outline: none;

      background: white;
      color: var(--text);

      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.10);
    }

    button.send-btn {
      flex-shrink: 0;

      min-width: 72px;
      height: 46px;

      padding:
        0
        18px;

      background: var(--primary);
      color: white;

      border: none;

      border-radius: 9px;

      cursor: pointer;

      font-weight: 700;
    }

    button.send-btn:hover {
      background: var(--primary-dark);
    }

    button.send-btn:disabled {
      opacity: 0.6;

      cursor: wait;
    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal-overlay {
      display: none;

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100dvh;

      background:
        rgba(15, 23, 42, 0.55);

      justify-content: center;
      align-items: center;

      z-index: 1000;

      padding: 20px;

      overscroll-behavior: contain;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      width: min(650px, 100%);

      max-height:
        calc(100dvh - 40px);

      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      background: white;

      padding: 24px;

      border-radius: 14px;

      display: flex;
      flex-direction: column;

      gap: 18px;

      box-shadow:
        0 20px 60px
        rgba(15, 23, 42, 0.20);
    }

    .modal-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      border-bottom:
        1px solid var(--border);

      padding-bottom: 10px;
    }

    .modal-header h3 {
      font-size: 1.05rem;
    }

    .modal-close-btn {
      color: #64748b;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .form-group label {
      font-size: 0.88rem;

      font-weight: 700;

      color: #334155;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;

      padding: 10px 12px;

      border:
        1px solid #cbd5e1;

      border-radius: 7px;

      font-size: 0.9rem;

      outline: none;

      background: white;
      color: var(--text);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.08);
    }

    .form-group textarea {
      min-height: 220px;

      resize: vertical;

      line-height: 1.55;

      overflow-wrap: anywhere;
    }

    .helper-text {
      font-size: 0.76rem;

      color: #94a3b8;

      line-height: 1.4;
    }

    .radio-group {
      display: flex;

      gap: 18px;

      align-items: center;

      flex-wrap: wrap;
    }

    .radio-label {
      display: flex;

      align-items: center;

      gap: 6px;

      font-size: 0.9rem;

      color: #1e293b;

      cursor: pointer;

      line-height: 1.4;
    }

    .radio-label input[type="radio"] {
      width: 16px;
      height: 16px;

      margin: 0;

      cursor: pointer;
    }

    .modal-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      padding-top: 4px;
    }

    .save-btn {
      min-height: 42px;

      background: var(--success);

      color: white;

      border: none;

      padding:
        0
        18px;

      border-radius: 7px;

      cursor: pointer;

      font-weight: 700;
    }

    .save-btn:hover {
      background: #15803d;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      :root {
        --header-height: 56px;
      }

      header {
        padding:
          max(8px, env(safe-area-inset-top))
          12px
          8px
          12px;

        gap: 8px;
      }

      header h1 {
        font-size: 0.98rem;
      }

      .model-badge {
        max-width: 140px;

        font-size: 0.68rem;

        padding:
          4px 8px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;

        font-size: 1.2rem;
      }

      #chat-container {
        padding:
          14px
          12px;
      }

      .message {
        max-width: 94%;

        padding:
          10px
          13px;

        font-size: 0.92rem;

        border-radius: 10px;
      }

      #input-container {
        padding:
          8px
          10px
          calc(8px + env(safe-area-inset-bottom))
          10px;

        gap: 7px;
      }

      input[type="text"] {
        height: 44px;

        font-size: 0.9rem;

        border-radius: 8px;
      }

      button.send-btn {
        min-width: 58px;
        height: 44px;

        padding:
          0
          12px;

        border-radius: 8px;

        font-size: 0.88rem;
      }

      .modal-overlay {
        padding:
          10px;
      }

      .modal-content {
        width: 100%;

        max-height:
          calc(100dvh - 20px);

        padding:
          18px;

        border-radius: 12px;

        gap: 15px;
      }

      .modal-header h3 {
        font-size: 1rem;
      }

      .form-group textarea {
        min-height: 180px;
      }

      .radio-group {
        gap: 12px;
      }

      .radio-label {
        font-size: 0.84rem;
      }

      .modal-footer {
        position: sticky;

        bottom: 0;

        background: white;

        padding-top: 8px;
      }

      .save-btn {
        width: 100%;
      }

      .timing-row {
        min-width: 180px;

        gap: 10px;
      }

    }

    /* =========================================================
       VERY SMALL MOBILE
       ========================================================= */

    @media (max-width: 390px) {

      header h1 {
        font-size: 0.88rem;
      }

      .model-badge {
        display: none;
      }

      .message {
        max-width: 96%;

        font-size: 0.89rem;
      }

      .radio-group {
        flex-direction: column;

        align-items: flex-start;
      }

      .modal-content {
        padding:
          15px;
      }

    }
  </style>
</head>

<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header>

    <h1>
      ✨ 사주그랩 백서 RAG 챗봇
    </h1>

    <div class="header-controls">

      <span
        class="model-badge"
        id="header-model-badge"
      >
        로딩 중...
      </span>

      <button
        class="icon-btn"
        id="open-settings-btn"
        title="설정"
        type="button"
        aria-label="설정"
      >
        ⚙️
      </button>

    </div>

  </header>

  <!-- =========================================================
       CHAT
       ========================================================= -->

  <div id="chat-container">

    <div class="message ai">
      안녕하세요!
      사주그랩 기술 백서에 대해
      무엇이든 물어보세요.
    </div>

  </div>

  <!-- =========================================================
       INPUT
       ========================================================= -->

  <form id="input-container">

    <input
      type="text"
      id="user-input"
      placeholder="질문을 입력하세요..."
      required
      autocomplete="off"
      enterkeyhint="send"
    >

    <button
      type="submit"
      class="send-btn"
      id="send-btn"
    >
      전송
    </button>

  </form>

  <!-- =========================================================
       SETTINGS MODAL
       ========================================================= -->

  <div
    class="modal-overlay"
    id="settings-modal"
    aria-hidden="true"
  >

    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
    >

      <div class="modal-header">

        <h3 id="settings-title">
          ⚙️ RAG 설정
        </h3>

        <button
          class="icon-btn modal-close-btn"
          id="close-modal-btn"
          type="button"
          aria-label="설정 닫기"
        >
          ✕
        </button>

      </div>

      <!-- SYSTEM PROMPT -->

      <div class="form-group">

        <label for="cfg-system-prompt">
          시스템 프롬프트
        </label>

        <textarea
          id="cfg-system-prompt"
          placeholder="LLM의 역할과 답변 규칙을 입력하세요..."
        ></textarea>

        <span class="helper-text">
          저장된 시스템 프롬프트가
          최종 LLM의 System / Instructions 영역으로 전달됩니다.
        </span>

      </div>

      <!-- MODEL -->

      <div class="form-group">

        <label>
          LLM 모델
        </label>

        <div class="radio-group">

          <label class="radio-label">

            <input
              type="radio"
              name="cfg-model"
              value="gemini-3.1-flash-lite"
            >

            <span>
              Gemini 3.1 Flash-Lite
            </span>

          </label>

          <label class="radio-label">

            <input
              type="radio"
              name="cfg-model"
              value="gpt-5.6-luna"
            >

            <span>
              GPT-5.6 Luna
            </span>

          </label>

        </div>

      </div>

      <!-- TOP K -->

      <div class="form-group">

        <label for="cfg-topk">
          검색 청크 수 (Top K)
        </label>

        <input
          type="number"
          id="cfg-topk"
          min="1"
          max="10"
          step="1"
          inputmode="numeric"
        >

        <span class="helper-text">
          Vector Search에서 먼저 가져올
          백서 청크의 개수입니다.
        </span>

      </div>

      <!-- DISTANCE -->

      <div class="form-group">

        <label for="cfg-distance">
          검색 거리 기준 (Cosine Distance)
        </label>

        <input
          type="number"
          id="cfg-distance"
          min="0"
          max="2"
          step="0.01"
          inputmode="decimal"
        >

        <span class="helper-text">
          값이 낮을수록 질문과 더 유사한
          청크만 답변 근거로 사용합니다.
        </span>

      </div>

      <!-- FOOTER -->

      <div class="modal-footer">

        <button
          type="button"
          class="save-btn"
          id="save-settings-btn"
        >
          저장 및 창 닫기
        </button>

      </div>

    </div>

  </div>

  <script>

    /* =========================================================
       DOM
       ========================================================= */

    const chatContainer =
      document.getElementById(
        'chat-container'
      );

    const inputForm =
      document.getElementById(
        'input-container'
      );

    const userInput =
      document.getElementById(
        'user-input'
      );

    const sendButton =
      document.getElementById(
        'send-btn'
      );

    const modal =
      document.getElementById(
        'settings-modal'
      );

    const openSettingsBtn =
      document.getElementById(
        'open-settings-btn'
      );

    const closeModalBtn =
      document.getElementById(
        'close-modal-btn'
      );

    const saveSettingsBtn =
      document.getElementById(
        'save-settings-btn'
      );

    const headerModelBadge =
      document.getElementById(
        'header-model-badge'
      );

    /* =========================================================
       MODEL NAMES
       ========================================================= */

    const MODEL_NAMES = {

      'gemini-3.1-flash-lite':
        'Gemini 3.1 Flash-Lite',

      'gpt-5.6-luna':
        'GPT-5.6 Luna'

    };

    /* =========================================================
       DEFAULT SYSTEM PROMPT
       ========================================================= */

    const DEFAULT_SYSTEM_PROMPT = `
너는 사주그랩 기술 백서를 근거로 답변하는 RAG 어시스턴트다.

다음 규칙을 지켜라.

1. 제공된 백서 근거를 가장 중요한 사실 근거로 사용한다.
2. 백서 근거에 없는 내용을 사실처럼 만들어내지 않는다.
3. 근거가 충분하지 않으면 "제공된 백서에서 확인할 수 없습니다."라고 답한다.
4. 숫자, 공식, 가중치, 알고리즘, 구조에 관한 내용은 백서의 의미를 임의로 변경하지 않는다.
5. 사용자가 질문한 내용에 직접적으로 답한다.
6. 백서 근거와 일반적인 지식을 혼동하지 않는다.
`.trim();

    /* =========================================================
       DEFAULT CONFIG
       ========================================================= */

    const DEFAULT_CONFIG = {

      systemPrompt:
        DEFAULT_SYSTEM_PROMPT,

      model:
        'gemini-3.1-flash-lite',

      topK:
        5,

      distanceThreshold:
        0.70

    };

    /* =========================================================
       CONFIG
       ========================================================= */

    function getConfig() {

      const saved =
        localStorage.getItem(
          'rag_config'
        );

      if (!saved) {

        return {
          ...DEFAULT_CONFIG
        };

      }

      try {

        const parsed =
          JSON.parse(
            saved
          );

        return {

          ...DEFAULT_CONFIG,

          ...parsed

        };

      } catch {

        return {
          ...DEFAULT_CONFIG
        };

      }

    }

    function saveConfig(
      config
    ) {

      localStorage.setItem(
        'rag_config',
        JSON.stringify(
          config
        )
      );

    }

    /* =========================================================
       HEADER
       ========================================================= */

    function updateHeaderBadge(
      model
    ) {

      headerModelBadge.innerText =
        MODEL_NAMES[model] ||
        model;

    }

    /* =========================================================
       SETTINGS UI
       ========================================================= */

    function loadSettingsToUI() {

      const config =
        getConfig();

      document.getElementById(
        'cfg-system-prompt'
      ).value =
        config.systemPrompt || '';

      document.getElementById(
        'cfg-topk'
      ).value =
        config.topK;

      document.getElementById(
        'cfg-distance'
      ).value =
        config.distanceThreshold;

      const targetRadio =
        document.querySelector(
          `input[name="cfg-model"][value="${config.model}"]`
        );

      if (targetRadio) {

        targetRadio.checked =
          true;

      }

      updateHeaderBadge(
        config.model
      );

    }

    /* =========================================================
       MESSAGE
       ========================================================= */

    function appendMessage(
      sender,
      text
    ) {

      const message =
        document.createElement(
          'div'
        );

      message.classList.add(
        'message',
        sender
      );

      message.innerText =
        text;

      chatContainer.appendChild(
        message
      );

      chatContainer.scrollTop =
        chatContainer.scrollHeight;

      return message;

    }

    /* =========================================================
       RESPONSE TIMER
       ========================================================= */

    function createResponseTimer(
      parentElement
    ) {

      const timer =
        document.createElement(
          'div'
        );

      timer.className =
        'response-timer loading';

      timer.innerText =
        '⏱ 0.00초';

      parentElement.appendChild(
        timer
      );

      const startTime =
        performance.now();

      let stopped =
        false;

      const update =
        () => {

          if (stopped) {
            return;
          }

          const elapsed =
            (
              performance.now() -
              startTime
            ) / 1000;

          timer.innerText =
            `⏱ ${elapsed.toFixed(2)}초`;

          requestAnimationFrame(
            update
          );

        };

      requestAnimationFrame(
        update
      );

      return {

        element:
          timer,

        stop() {

          if (stopped) {
            return 0;
          }

          stopped =
            true;

          const elapsed =
            (
              performance.now() -
              startTime
            ) / 1000;

          timer.classList.remove(
            'loading'
          );

          timer.innerText =
            `⏱ 응답 시간 ${elapsed.toFixed(2)}초`;

          return elapsed;

        },

        errorStop() {

          if (stopped) {
            return 0;
          }

          stopped =
            true;

          const elapsed =
            (
              performance.now() -
              startTime
            ) / 1000;

          timer.classList.remove(
            'loading'
          );

          timer.classList.add(
            'error'
          );

          timer.innerText =
            `⏱ 오류까지 ${elapsed.toFixed(2)}초`;

          return elapsed;

        }

      };

    }

    /* =========================================================
       SERVER TIMING
       ========================================================= */

    function appendTimingInfo(
      messageElement,
      serverTiming,
      clientElapsed
    ) {

      const timingBox =
        document.createElement(
          'div'
        );

      timingBox.className =
        'timing-box';

      /*
       * 서버가 timing 정보를 반환하면
       * 세부 항목을 표시합니다.
       *
       * 현재 api/chat.js가 아직 반환하지 않는 경우에는
       * 전체 시간만 표시합니다.
       */

      if (
        serverTiming &&
        typeof serverTiming ===
          'object'
      ) {

        const embedding =
          Number(
            serverTiming.embeddingMs
          );

        const retrieval =
          Number(
            serverTiming.retrievalMs
          );

        const llm =
          Number(
            serverTiming.llmMs
          );

        const serverTotal =
          Number(
            serverTiming.totalMs
          );

        if (
          Number.isFinite(
            embedding
          )
        ) {

          timingBox.insertAdjacentHTML(
            'beforeend',

            `
              <div class="timing-row">
                <span class="timing-label">
                  임베딩
                </span>

                <span class="timing-value">
                  ${(embedding / 1000).toFixed(2)}초
                </span>
              </div>
            `
          );

        }

        if (
          Number.isFinite(
            retrieval
          )
        ) {

          timingBox.insertAdjacentHTML(
            'beforeend',

            `
              <div class="timing-row">
                <span class="timing-label">
                  Firebase RAG
                </span>

                <span class="timing-value">
                  ${(retrieval / 1000).toFixed(2)}초
                </span>
              </div>
            `
          );

        }

        if (
          Number.isFinite(
            llm
          )
        ) {

          timingBox.insertAdjacentHTML(
            'beforeend',

            `
              <div class="timing-row">
                <span class="timing-label">
                  LLM 생성
                </span>

                <span class="timing-value">
                  ${(llm / 1000).toFixed(2)}초
                </span>
              </div>
            `
          );

        }

        const total =
          Number.isFinite(
            serverTotal
          )
            ? serverTotal
            : clientElapsed;

        timingBox.insertAdjacentHTML(
          'beforeend',

          `
            <div class="timing-row">
              <span class="timing-label">
                전체
              </span>

              <span class="timing-value">
                ${(total / 1000).toFixed(2)}초
              </span>
            </div>
          `
        );

      } else {

        timingBox.insertAdjacentHTML(
          'beforeend',

          `
            <div class="timing-row">
              <span class="timing-label">
                전체 응답
              </span>

              <span class="timing-value">
                ${(clientElapsed / 1000).toFixed(2)}초
              </span>
            </div>
          `
        );

      }

      messageElement.appendChild(
        timingBox
      );

    }

    /* =========================================================
       RETRIEVAL INFO
       ========================================================= */

    function appendRetrievalInfo(
      messageElement,
      data
    ) {

      const retrieval =
        data?.retrieval;

      if (!retrieval) {
        return;
      }

      const meta =
        document.createElement(
          'div'
        );

      meta.className =
        'message-meta';

      meta.innerText =
        `모델: ${
          MODEL_NAMES[data.model] ||
          data.model
        } · ` +
        `검색 ${
          retrieval.searchedCount
        }개 · ` +
        `채택 ${
          retrieval.matchedCount
        }개`;

      messageElement.appendChild(
        meta
      );

      if (
        !Array.isArray(
          retrieval.chunks
        ) ||
        retrieval.chunks.length ===
          0
      ) {

        return;

      }

      const sources =
        document.createElement(
          'div'
        );

      sources.className =
        'sources';

      retrieval.chunks.forEach(
        (
          chunk,
          index
        ) => {

          const item =
            document.createElement(
              'details'
            );

          item.className =
            'source-item';

          const summary =
            document.createElement(
              'summary'
            );

          const distance =
            typeof chunk.distance ===
              'number'
              ? chunk.distance.toFixed(
                  4
                )
              : 'n/a';

          const chunkIndex =
            chunk.chunk_index !==
              null &&
            chunk.chunk_index !==
              undefined
              ? ` · chunk ${chunk.chunk_index}`
              : '';

          summary.innerText =
            `근거 ${
              index + 1
            } · distance ${
              distance
            }${chunkIndex}`;

          const text =
            document.createElement(
              'div'
            );

          text.className =
            'source-text';

          text.innerText =
            chunk.text || '';

          item.appendChild(
            summary
          );

          item.appendChild(
            text
          );

          sources.appendChild(
            item
          );

        }
      );

      messageElement.appendChild(
        sources
      );

      chatContainer.scrollTop =
        chatContainer.scrollHeight;

    }

    /* =========================================================
       SEND MESSAGE
       ========================================================= */

    inputForm.addEventListener(
      'submit',
      async (
        event
      ) => {

        event.preventDefault();

        const query =
          userInput.value.trim();

        if (!query) {
          return;
        }

        const config =
          getConfig();

        if (
          !config.systemPrompt ||
          !config.systemPrompt.trim()
        ) {

          alert(
            '먼저 ⚙️ 설정에서 시스템 프롬프트를 입력하고 저장해주세요.'
          );

          return;

        }

        /* -------------------------------------------------------
           사용자 메시지
           ------------------------------------------------------- */

        appendMessage(
          'user',
          query
        );

        userInput.value =
          '';

        sendButton.disabled =
          true;

        /* -------------------------------------------------------
           로딩 메시지
           ------------------------------------------------------- */

        const loadingMessage =
          appendMessage(
            'ai',
            '🔍 백서 검색 및 답변 생성 중...'
          );

        /* -------------------------------------------------------
           전체 클라이언트 타이머 시작
           ------------------------------------------------------- */

        const clientStart =
          performance.now();

        const timer =
          createResponseTimer(
            loadingMessage
          );

        try {

          /* -----------------------------------------------------
             API 요청
             ----------------------------------------------------- */

          const response =
            await fetch(
              '/api/chat',
              {

                method:
                  'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({

                    message:
                      query,

                    systemPrompt:
                      config.systemPrompt,

                    model:
                      config.model,

                    topK:
                      config.topK,

                    distanceThreshold:
                      config.distanceThreshold

                  })

              }
            );

          /* -----------------------------------------------------
             전체 클라이언트 시간
             ----------------------------------------------------- */

          const clientElapsed =
            performance.now() -
            clientStart;

          let data;

          try {

            data =
              await response.json();

          } catch {

            throw new Error(
              `서버가 올바른 JSON 응답을 반환하지 않았습니다. (${response.status})`
            );

          }

          if (
            !response.ok ||
            data.error
          ) {

            throw new Error(
              data.error ||
              `서버 에러 (${response.status})`
            );

          }

          /* -----------------------------------------------------
             타이머 종료
             ----------------------------------------------------- */

          timer.stop();

          /* -----------------------------------------------------
             답변으로 교체
             ----------------------------------------------------- */

          loadingMessage.innerText =
            data.answer ||
            '답변을 가져올 수 없습니다.';

          /*
           * 타이머는 답변에 붙여서 영구적으로 유지합니다.
           */
          loadingMessage.appendChild(
            timer.element
          );

          /* -----------------------------------------------------
             3단계 처리 시간 표시
             ----------------------------------------------------- */

          appendTimingInfo(
            loadingMessage,
            data.timing,
            clientElapsed
          );

          /* -----------------------------------------------------
             RAG 근거
             ----------------------------------------------------- */

          appendRetrievalInfo(
            loadingMessage,
            data
          );

        } catch (
          error
        ) {

          const clientElapsed =
            performance.now() -
            clientStart;

          timer.errorStop();

          loadingMessage.innerText =
            '❌ 오류가 발생했습니다: ' +
            (
              error?.message ||
              '알 수 없는 오류'
            );

          /*
           * 오류가 나도 타이머 유지
           */
          loadingMessage.appendChild(
            timer.element
          );

          appendTimingInfo(
            loadingMessage,
            null,
            clientElapsed
          );

        } finally {

          sendButton.disabled =
            false;

          userInput.focus();

        }

      }
    );

    /* =========================================================
       SETTINGS OPEN
       ========================================================= */

    openSettingsBtn.addEventListener(
      'click',
      () => {

        loadSettingsToUI();

        modal.classList.add(
          'active'
        );

        modal.setAttribute(
          'aria-hidden',
          'false'
        );

      }
    );

    /* =========================================================
       SETTINGS CLOSE
       ========================================================= */

    function closeSettings() {

      modal.classList.remove(
        'active'
      );

      modal.setAttribute(
        'aria-hidden',
        'true'
      );

    }

    closeModalBtn.addEventListener(
      'click',
      closeSettings
    );

    modal.addEventListener(
      'click',
      (
        event
      ) => {

        if (
          event.target ===
          modal
        ) {

          closeSettings();

        }

      }
    );

    /* =========================================================
       ESC
       ========================================================= */

    document.addEventListener(
      'keydown',
      (
        event
      ) => {

        if (
          event.key ===
          'Escape'
        ) {

          if (
            modal.classList.contains(
              'active'
            )
          ) {

            closeSettings();

          }

        }

      }
    );

    /* =========================================================
       SAVE SETTINGS
       ========================================================= */

    saveSettingsBtn.addEventListener(
      'click',
      () => {

        const systemPrompt =
          document
            .getElementById(
              'cfg-system-prompt'
            )
            .value
            .trim();

        if (!systemPrompt) {

          alert(
            '시스템 프롬프트를 입력해주세요.'
          );

          return;

        }

        if (
          systemPrompt.length >
          30000
        ) {

          alert(
            '시스템 프롬프트는 30,000자 이하로 입력해주세요.'
          );

          return;

        }

        const selectedRadio =
          document.querySelector(
            'input[name="cfg-model"]:checked'
          );

        const topK =
          parseInt(
            document
              .getElementById(
                'cfg-topk'
              )
              .value,
            10
          );

        const distanceThreshold =
          parseFloat(
            document
              .getElementById(
                'cfg-distance'
              )
              .value
          );

        const newConfig = {

          systemPrompt,

          model:
            selectedRadio?.value ||
            DEFAULT_CONFIG.model,

          topK:
            Number.isFinite(
              topK
            ) &&
            topK >= 1 &&
            topK <= 10
              ? topK
              : DEFAULT_CONFIG.topK,

          distanceThreshold:
            Number.isFinite(
              distanceThreshold
            ) &&
            distanceThreshold >= 0 &&
            distanceThreshold <= 2
              ? distanceThreshold
              : DEFAULT_CONFIG.distanceThreshold

        };

        saveConfig(
          newConfig
        );

        updateHeaderBadge(
          newConfig.model
        );

        closeSettings();

      }
    );

    /* =========================================================
       INIT
       ========================================================= */

    loadSettingsToUI();

  </script>

</body>
