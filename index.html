<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사주그랩 백서 RAG 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    
    /* 헤더 */
    header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; }
    .icon-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

    /* 채팅창 영역 */
    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background: white; color: #1e293b; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }

    /* 입력폼 */
    #input-container { padding: 15px 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #e2e8f0; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
    button.send-btn { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    /* 모달 창 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 550px; display: flex; flex-direction: column; gap: 15px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: bold; color: #475569; }
    .form-group textarea, .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .form-group textarea { height: 100px; resize: vertical; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .save-btn { background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>✨ 사주그랩 백서 RAG 챗봇</h1>
    <button class="icon-btn" id="open-settings-btn">⚙️</button>
  </header>

  <div id="chat-container">
    <div class="message ai">안녕하세요! 사주그랩 기술 백서에 대해 무엇이든 물어보세요.</div>
  </div>

  <form id="input-container">
    <input type="text" id="user-input" placeholder="질문을 입력하세요..." required autocomplete="off">
    <button type="submit" class="send-btn">전송</button>
  </form>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ RAG 파라미터 설정 (config.json)</h3>
        <button class="icon-btn" id="close-modal-btn" style="color: #64748b;">✕</button>
      </div>

      <div class="form-group">
        <label>시스템 프롬프트 (System Prompt)</label>
        <textarea id="cfg-sysprompt"></textarea>
      </div>

      <div class="form-group">
        <label>Gemini 모델</label>
        <select id="cfg-model">
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (빠름/경량)</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash (고성능)</option>
        </select>
      </div>

      <div class="form-group">
        <label>검색 청크 수 (Limit)</label>
        <input type="number" id="cfg-limit" min="1" max="10">
      </div>

      <div class="form-group">
        <label>창의성 온도 (Temperature: 0.0 ~ 1.0)</label>
        <input type="number" id="cfg-temp" step="0.1" min="0" max="1">
      </div>

      <div class="modal-footer">
        <button type="button" class="save-btn" id="save-settings-btn">저장 및 창 닫기</button>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-container');
    const userInput = document.getElementById('user-input');

    const modal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');

    // 1. 메시지 추가 함수
    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    // 2. 질문 전송 처리
    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;

      appendMessage('user', query);
      userInput.value = '';

      const loadingMsg = appendMessage('ai', '🔍 백서 검색 및 답변 생성 중...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query })
        });
        const data = await res.json();
        loadingMsg.innerText = data.answer || '답변을 가져올 수 없습니다.';
      } catch (err) {
        loadingMsg.innerText = '❌ 오류가 발생했습니다: ' + err.message;
      }
    });

    // 3. 설정 로드 (서버에서 config.json 읽기)
    async function loadSettings() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        document.getElementById('cfg-sysprompt').value = config.systemPrompt;
        document.getElementById('cfg-model').value = config.model;
        document.getElementById('cfg-limit').value = config.limit;
        document.getElementById('cfg-temp').value = config.temperature;
      } catch (err) {
        alert('설정을 불러오지 못했습니다.');
      }
    }

    // 4. 설정 저장 (서버로 보내 config.json에 기록)
    async function saveSettings() {
      const updatedConfig = {
        systemPrompt: document.getElementById('cfg-sysprompt').value,
        model: document.getElementById('cfg-model').value,
        limit: parseInt(document.getElementById('cfg-limit').value, 10),
        temperature: parseFloat(document.getElementById('cfg-temp').value)
      };

      try {
        await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedConfig)
        });
        modal.classList.remove('active');
      } catch (err) {
        alert('설정 저장 실패: ' + err.message);
      }
    }

    // 모달 이벤트
    openSettingsBtn.addEventListener('click', () => {
      loadSettings();
      modal.classList.add('active');
    });
    closeModalBtn.addEventListener('click', saveSettings);
    saveSettingsBtn.addEventListener('click', saveSettings);
  </script>
</body>
</html>
