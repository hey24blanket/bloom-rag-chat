<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사주그랩 백서 RAG 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    
    /* 헤더 */
    header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; }
    
    /* 헤더 우측 컨트롤 (뱃지 + ⚙️ 아이콘) */
    .header-controls { display: flex; align-items: center; gap: 12px; }
    .model-badge { font-size: 0.78rem; color: #94a3b8; background: #334155; padding: 4px 10px; border-radius: 12px; border: 1px solid #475569; }
    .icon-btn { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background: white; color: #1e293b; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }

    #input-container { padding: 15px 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #e2e8f0; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
    button.send-btn { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    /* 모달 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 550px; display: flex; flex-direction: column; gap: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.88rem; font-weight: bold; color: #334155; }
    .form-group textarea, .form-group input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    .form-group textarea { height: 90px; resize: vertical; }
    
    .helper-text { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; line-height: 1.3; }

    .radio-group { display: flex; gap: 20px; margin-top: 4px; align-items: center; }
    .radio-label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: #1e293b; cursor: pointer; }
    .radio-label input[type="radio"] { cursor: pointer; width: 16px; height: 16px; }

    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .save-btn { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>✨ 사주그랩 백서 RAG 챗봇</h1>
    <div class="header-controls">
      <!-- 선택된 모델 뱃지 표시 -->
      <span class="model-badge" id="header-model-badge">로딩 중...</span>
      <button class="icon-btn" id="open-settings-btn" title="설정">⚙️</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="message ai">안녕하세요! 사주그랩 기술 백서에 대해 무엇이든 물어보세요.</div>
  </div>

  <form id="input-container">
    <input type="text" id="user-input" placeholder="질문을 입력하세요..." required autocomplete="off">
    <button type="submit" class="send-btn">전송</button>
  </form>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ RAG 파라미터 설정 (config.json)</h3>
        <button class="icon-btn" id="close-modal-btn" style="color: #64748b;">✕</button>
      </div>

      <div class="form-group">
        <label>시스템 프롬프트 (System Prompt)</label>
        <textarea id="cfg-sysprompt"></textarea>
      </div>

      <div class="form-group">
        <label>LLM 모델</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="cfg-model" value="gemini-3.1-flash-lite"> Gemini 3.1 Flash-Lite
          </label>
          <label class="radio-label">
            <input type="radio" name="cfg-model" value="gpt-5.6-lunar"> GPT 5.6 Lunar
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>검색 청크 수 (Limit)</label>
        <input type="number" id="cfg-limit" min="1" max="10">
        <span class="helper-text">질문 답변 시 Vector DB에서 참조할 백서 조각(청크)의 개수입니다.</span>
      </div>

      <div class="form-group">
        <label>창의성 온도 (Temperature: 0.0 ~ 1.0)</label>
        <input type="number" id="cfg-temp" step="0.1" min="0" max="1">
        <span class="helper-text">높을수록 답변이 다양하고 창의적이며, 낮을수록 백서 내용에 충실합니다.</span>
      </div>

      <div class="modal-footer">
        <button type="button" class="save-btn" id="save-settings-btn">저장 및 창 닫기</button>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-container');
    const userInput = document.getElementById('user-input');

    const modal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const headerModelBadge = document.getElementById('header-model-badge');

    const MODEL_NAMES = {
      'gemini-3.1-flash-lite': 'Gemini 3.1 Flash-Lite',
      'gpt-5.6-lunar': 'GPT 5.6 Lunar'
    };

    const DEFAULT_CONFIG = {
      systemPrompt: "당신은 사주그랩 기술 백서 기반 전문가입니다. 아래 제공된 [백서 내용]만을 참고하여 질문에 답하세요.",
      model: "gemini-3.1-flash-lite",
      limit: 2,
      temperature: 0.2
    };

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    // 헤더 뱃지 텍스트 갱신
    function updateHeaderBadge(modelValue) {
      headerModelBadge.innerText = MODEL_NAMES[modelValue] || modelValue;
    }

    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;

      appendMessage('user', query);
      userInput.value = '';

      const loadingMsg = appendMessage('ai', '🔍 백서 검색 및 답변 생성 중...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query })
        });
        
        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          const htmlText = await res.text();
          throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
        }

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        loadingMsg.innerText = data.answer || '답변을 가져올 수 없습니다.';
      } catch (err) {
        loadingMsg.innerText = '❌ 오류가 발생했습니다: ' + err.message;
      }
    });

    async function loadSettings() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        
        document.getElementById('cfg-sysprompt').value = config.systemPrompt || DEFAULT_CONFIG.systemPrompt;
        document.getElementById('cfg-limit').value = config.limit ?? DEFAULT_CONFIG.limit;
        document.getElementById('cfg-temp').value = config.temperature ?? DEFAULT_CONFIG.temperature;

        const selectedModel = config.model || DEFAULT_CONFIG.model;
        const targetRadio = document.querySelector(`input[name="cfg-model"][value="${selectedModel}"]`);
        if (targetRadio) {
          targetRadio.checked = true;
        } else {
          document.querySelector('input[name="cfg-model"]').checked = true;
        }

        updateHeaderBadge(selectedModel);
      } catch (err) {
        console.error('설정 로드 실패:', err);
        updateHeaderBadge(DEFAULT_CONFIG.model);
      }
    }

    async function saveSettings() {
      const selectedModelRadio = document.querySelector('input[name="cfg-model"]:checked');
      const selectedModel = selectedModelRadio ? selectedModelRadio.value : DEFAULT_CONFIG.model;
      
      const updatedConfig = {
        systemPrompt: document.getElementById('cfg-sysprompt').value,
        model: selectedModel,
        limit: parseInt(document.getElementById('cfg-limit').value, 10) || DEFAULT_CONFIG.limit,
        temperature: parseFloat(document.getElementById('cfg-temp').value) ?? DEFAULT_CONFIG.temperature
      };

      try {
        await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedConfig)
        });
        updateHeaderBadge(selectedModel);
        modal.classList.remove('active');
      } catch (err) {
        alert('설정 저장 실패: ' + err.message);
      }
    }

    // 초기 실행 시 설정값 및 헤더 뱃지 로드
    loadSettings();

    openSettingsBtn.addEventListener('click', () => {
      loadSettings();
      modal.classList.add('active');
    });
    closeModalBtn.addEventListener('click', saveSettings);
    saveSettingsBtn.addEventListener('click', saveSettings);
  </script>
</body>
</html>
