<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    사주그랩 백서 RAG 챗봇
  </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
    }

    body {
      background-color: #f4f6f8;

      display: flex;
      flex-direction: column;

      height: 100vh;
    }

    header {
      background: #1e293b;
      color: white;

      padding: 15px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;
    }

    header h1 {
      font-size: 1.2rem;
    }

    .header-controls {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .model-badge {
      font-size: 0.78rem;

      color: #cbd5e1;
      background: #334155;

      padding: 5px 10px;

      border-radius: 12px;

      border: 1px solid #475569;

      white-space: nowrap;
    }

    .icon-btn {
      background: none;
      border: none;

      color: white;

      font-size: 1.4rem;

      cursor: pointer;

      display: flex;
      align-items: center;
    }

    #chat-container {
      flex: 1;

      overflow-y: auto;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 15px;
    }

    .message {
      max-width: 85%;

      padding: 12px 16px;

      border-radius: 12px;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .user {
      align-self: flex-end;

      background: #2563eb;
      color: white;

      border-bottom-right-radius: 2px;
    }

    .ai {
      align-self: flex-start;

      background: white;

      color: #1e293b;

      border-bottom-left-radius: 2px;

      border: 1px solid #e2e8f0;
    }

    .message-meta {
      margin-top: 10px;

      padding-top: 8px;

      border-top:
        1px solid #e2e8f0;

      font-size: 0.75rem;

      color: #64748b;
    }

    .sources {
      margin-top: 8px;

      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    .source-item {
      background: #f8fafc;

      border:
        1px solid #e2e8f0;

      border-radius: 6px;

      padding: 7px 9px;

      font-size: 0.75rem;

      color: #475569;
    }

    .source-item summary {
      cursor: pointer;

      font-weight: 600;
    }

    .source-text {
      margin-top: 7px;

      line-height: 1.45;

      white-space: pre-wrap;
    }

    #input-container {
      padding: 15px 20px;

      background: white;

      display: flex;

      gap: 10px;

      border-top:
        1px solid #e2e8f0;
    }

    input[type="text"] {
      flex: 1;

      padding: 12px;

      border:
        1px solid #cbd5e1;

      border-radius: 8px;

      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    button.send-btn {
      padding: 12px 24px;

      background: #2563eb;
      color: white;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;
    }

    button.send-btn:disabled {
      opacity: 0.6;

      cursor: wait;
    }

    .modal-overlay {
      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
        rgba(0, 0, 0, 0.5);

      justify-content: center;
      align-items: center;

      z-index: 100;

      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;

      padding: 25px;

      border-radius: 12px;

      width: 90%;

      max-width: 650px;

      display: flex;

      flex-direction: column;

      gap: 18px;

      max-height: 90vh;

      overflow-y: auto;
    }

    .modal-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      border-bottom:
        1px solid #e2e8f0;

      padding-bottom: 10px;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 6px;
    }

    .form-group label {
      font-size: 0.88rem;

      font-weight: bold;

      color: #334155;
    }

    .form-group input,
    .form-group textarea {
      padding: 10px 12px;

      border:
        1px solid #cbd5e1;

      border-radius: 6px;

      font-size: 0.9rem;

      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #2563eb;
    }

    .form-group textarea {
      min-height: 220px;

      resize: vertical;

      line-height: 1.5;
    }

    .helper-text {
      font-size: 0.78rem;

      color: #94a3b8;

      margin-top: 2px;

      line-height: 1.3;
    }

    .radio-group {
      display: flex;

      gap: 20px;

      margin-top: 4px;

      align-items: center;

      flex-wrap: wrap;
    }

    .radio-label {
      display: flex;

      align-items: center;

      gap: 6px;

      font-size: 0.9rem;

      color: #1e293b;

      cursor: pointer;
    }

    .radio-label input[type="radio"] {
      cursor: pointer;

      width: 16px;
      height: 16px;
    }

    .modal-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 10px;
    }

    .save-btn {
      background: #16a34a;

      color: white;

      border: none;

      padding: 10px 18px;

      border-radius: 6px;

      cursor: pointer;

      font-weight: bold;
    }

    @media (max-width: 640px) {

      header h1 {
        font-size: 1rem;
      }

      .model-badge {
        display: none;
      }

      .message {
        max-width: 92%;
      }

      .modal-content {
        padding: 18px;
      }

    }
  </style>
</head>

<body>

  <header>

    <h1>
      ✨ 사주그랩 백서 RAG 챗봇
    </h1>

    <div class="header-controls">

      <span
        class="model-badge"
        id="header-model-badge"
      >
        로딩 중...
      </span>

      <button
        class="icon-btn"
        id="open-settings-btn"
        title="설정"
        type="button"
      >
        ⚙️
      </button>

    </div>

  </header>

  <div id="chat-container">

    <div class="message ai">
      안녕하세요!
      사주그랩 기술 백서에 대해
      무엇이든 물어보세요.
    </div>

  </div>

  <form id="input-container">

    <input
      type="text"
      id="user-input"
      placeholder="질문을 입력하세요..."
      required
      autocomplete="off"
    >

    <button
      type="submit"
      class="send-btn"
      id="send-btn"
    >
      전송
    </button>

  </form>

  <!-- =======================================================================
       설정 모달
       ======================================================================= -->

  <div
    class="modal-overlay"
    id="settings-modal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h3>
          ⚙️ RAG 설정
        </h3>

        <button
          class="icon-btn"
          id="close-modal-btn"
          style="color:#64748b;"
          type="button"
        >
          ✕
        </button>

      </div>

      <!-- 시스템 프롬프트 -->

      <div class="form-group">

        <label for="cfg-system-prompt">
          시스템 프롬프트
        </label>

        <textarea
          id="cfg-system-prompt"
          placeholder="LLM의 역할과 답변 규칙을 입력하세요..."
        ></textarea>

        <span class="helper-text">
          이 프롬프트는 RAG 검색 결과보다 우선하는
          LLM의 시스템 지침으로 전달됩니다.
        </span>

      </div>

      <!-- LLM -->

      <div class="form-group">

        <label>
          LLM 모델
        </label>

        <div class="radio-group">

          <label class="radio-label">

            <input
              type="radio"
              name="cfg-model"
              value="gemini-3.1-flash-lite"
            >

            Gemini 3.1 Flash-Lite

          </label>

          <label class="radio-label">

            <input
              type="radio"
              name="cfg-model"
              value="gpt-5.6-luna"
            >

            GPT-5.6 Luna

          </label>

        </div>

      </div>

      <!-- Top K -->

      <div class="form-group">

        <label for="cfg-topk">
          검색 청크 수 (Top K)
        </label>

        <input
          type="number"
          id="cfg-topk"
          min="1"
          max="10"
          step="1"
        >

        <span class="helper-text">
          Vector Search에서 먼저 가져올
          백서 청크의 개수입니다.
        </span>

      </div>

      <!-- Distance -->

      <div class="form-group">

        <label for="cfg-distance">
          검색 거리 기준 (Cosine Distance)
        </label>

        <input
          type="number"
          id="cfg-distance"
          min="0"
          max="2"
          step="0.01"
        >

        <span class="helper-text">
          값이 낮을수록 질문과 더 유사한
          청크만 답변 근거로 사용합니다.
        </span>

      </div>

      <!-- Footer -->

      <div class="modal-footer">

        <button
          type="button"
          class="save-btn"
          id="save-settings-btn"
        >
          저장 및 창 닫기
        </button>

      </div>

    </div>

  </div>

  <script>

    /**
     * ------------------------------------------------------------------------
     * DOM
     * ------------------------------------------------------------------------
     */

    const chatContainer =
      document.getElementById(
        'chat-container'
      );

    const inputForm =
      document.getElementById(
        'input-container'
      );

    const userInput =
      document.getElementById(
        'user-input'
      );

    const sendButton =
      document.getElementById(
        'send-btn'
      );

    const modal =
      document.getElementById(
        'settings-modal'
      );

    const openSettingsBtn =
      document.getElementById(
        'open-settings-btn'
      );

    const closeModalBtn =
      document.getElementById(
        'close-modal-btn'
      );

    const saveSettingsBtn =
      document.getElementById(
        'save-settings-btn'
      );

    const headerModelBadge =
      document.getElementById(
        'header-model-badge'
      );

    /**
     * ------------------------------------------------------------------------
     * 모델명
     * ------------------------------------------------------------------------
     */

    const MODEL_NAMES = {
      'gemini-3.1-flash-lite':
        'Gemini 3.1 Flash-Lite',

      'gpt-5.6-luna':
        'GPT-5.6 Luna'
    };

    /**
     * ------------------------------------------------------------------------
     * 기본 시스템 프롬프트
     * ------------------------------------------------------------------------
     *
     * "서버 하드코딩"이 아니라 앱 최초 실행 시 사용할 초기값입니다.
     * 저장 후에는 localStorage 값이 우선합니다.
     *
     * 사용자가 원하면 설정창에서 언제든 수정할 수 있습니다.
     * ------------------------------------------------------------------------
     */

    const DEFAULT_SYSTEM_PROMPT = `
너는 사주그랩 기술 백서를 근거로 답변하는 RAG 어시스턴트다.

다음 규칙을 지켜라.

1. 제공된 백서 근거를 가장 중요한 사실 근거로 사용한다.
2. 백서 근거에 없는 내용을 사실처럼 만들어내지 않는다.
3. 근거가 충분하지 않으면 "제공된 백서에서 확인할 수 없습니다."라고 답한다.
4. 숫자, 공식, 가중치, 알고리즘, 구조에 관한 내용은 백서의 의미를 임의로 변경하지 않는다.
5. 사용자가 질문한 내용에 직접적으로 답한다.
6. 백서 근거와 일반적인 지식을 혼동하지 않는다.
`.trim();

    /**
     * ------------------------------------------------------------------------
     * 기본 설정
     * ------------------------------------------------------------------------
     */

    const DEFAULT_CONFIG = {

      systemPrompt:
        DEFAULT_SYSTEM_PROMPT,

      model:
        'gemini-3.1-flash-lite',

      topK:
        5,

      distanceThreshold:
        0.70

    };

    /**
     * ------------------------------------------------------------------------
     * 설정 읽기
     * ------------------------------------------------------------------------
     */

    function getConfig() {

      const saved =
        localStorage.getItem(
          'rag_config'
        );

      if (!saved) {

        return {
          ...DEFAULT_CONFIG
        };

      }

      try {

        const parsed =
          JSON.parse(saved);

        return {

          ...DEFAULT_CONFIG,

          ...parsed

        };

      } catch {

        return {

          ...DEFAULT_CONFIG

        };

      }

    }

    /**
     * ------------------------------------------------------------------------
     * 설정 저장
     * ------------------------------------------------------------------------
     */

    function saveConfig(
      config
    ) {

      localStorage.setItem(
        'rag_config',
        JSON.stringify(
          config
        )
      );

    }

    /**
     * ------------------------------------------------------------------------
     * 헤더 모델 표시
     * ------------------------------------------------------------------------
     */

    function updateHeaderBadge(
      model
    ) {

      headerModelBadge.innerText =
        MODEL_NAMES[model] ||
        model;

    }

    /**
     * ------------------------------------------------------------------------
     * 설정창 UI 로드
     * ------------------------------------------------------------------------
     */

    function loadSettingsToUI() {

      const config =
        getConfig();

      document.getElementById(
        'cfg-system-prompt'
      ).value =
        config.systemPrompt || '';

      document.getElementById(
        'cfg-topk'
      ).value =
        config.topK;

      document.getElementById(
        'cfg-distance'
      ).value =
        config.distanceThreshold;

      const targetRadio =
        document.querySelector(
          `input[name="cfg-model"][value="${config.model}"]`
        );

      if (targetRadio) {

        targetRadio.checked =
          true;

      }

      updateHeaderBadge(
        config.model
      );

    }

    /**
     * ------------------------------------------------------------------------
     * 메시지 추가
     * ------------------------------------------------------------------------
     */

    function appendMessage(
      sender,
      text
    ) {

      const message =
        document.createElement(
          'div'
        );

      message.classList.add(
        'message',
        sender
      );

      message.innerText =
        text;

      chatContainer.appendChild(
        message
      );

      chatContainer.scrollTop =
        chatContainer.scrollHeight;

      return message;

    }

    /**
     * ------------------------------------------------------------------------
     * Retrieval 정보 표시
     * ------------------------------------------------------------------------
     */

    function appendRetrievalInfo(
      messageElement,
      data
    ) {

      const retrieval =
        data?.retrieval;

      if (!retrieval) {
        return;
      }

      const meta =
        document.createElement(
          'div'
        );

      meta.className =
        'message-meta';

      meta.innerText =
        `모델: ${
          MODEL_NAMES[data.model] ||
          data.model
        } · ` +
        `검색 ${
          retrieval.searchedCount
        }개 · ` +
        `채택 ${
          retrieval.matchedCount
        }개`;

      messageElement.appendChild(
        meta
      );

      if (
        !Array.isArray(
          retrieval.chunks
        ) ||
        retrieval.chunks.length === 0
      ) {

        return;

      }

      const sources =
        document.createElement(
          'div'
        );

      sources.className =
        'sources';

      retrieval.chunks.forEach(
        (
          chunk,
          index
        ) => {

          const item =
            document.createElement(
              'details'
            );

          item.className =
            'source-item';

          const summary =
            document.createElement(
              'summary'
            );

          const distance =
            typeof chunk.distance ===
            'number'
              ? chunk.distance.toFixed(4)
              : 'n/a';

          const chunkIndex =
            chunk.chunk_index !==
              null &&
            chunk.chunk_index !==
              undefined
              ? ` · chunk ${chunk.chunk_index}`
              : '';

          summary.innerText =
            `근거 ${
              index + 1
            } · distance ${
              distance
            }${chunkIndex}`;

          const text =
            document.createElement(
              'div'
            );

          text.className =
            'source-text';

          text.innerText =
            chunk.text || '';

          item.appendChild(
            summary
          );

          item.appendChild(
            text
          );

          sources.appendChild(
            item
          );

        }
      );

      messageElement.appendChild(
        sources
      );

      chatContainer.scrollTop =
        chatContainer.scrollHeight;

    }

    /**
     * ------------------------------------------------------------------------
     * 질문 전송
     * ------------------------------------------------------------------------
     */

    inputForm.addEventListener(
      'submit',
      async (
        event
      ) => {

        event.preventDefault();

        const query =
          userInput.value.trim();

        if (!query) {
          return;
        }

        const config =
          getConfig();

        if (
          !config.systemPrompt ||
          !config.systemPrompt.trim()
        ) {

          alert(
            '먼저 ⚙️ 설정에서 시스템 프롬프트를 입력하고 저장해주세요.'
          );

          return;

        }

        appendMessage(
          'user',
          query
        );

        userInput.value =
          '';

        sendButton.disabled =
          true;

        const loadingMessage =
          appendMessage(
            'ai',
            '🔍 백서 검색 및 답변 생성 중...'
          );

        try {

          const response =
            await fetch(
              '/api/chat',
              {
                method:
                  'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({

                    message:
                      query,

                    systemPrompt:
                      config.systemPrompt,

                    model:
                      config.model,

                    topK:
                      config.topK,

                    distanceThreshold:
                      config.distanceThreshold

                  })
              }
            );

          let data;

          try {

            data =
              await response.json();

          } catch {

            throw new Error(
              `서버가 올바른 JSON 응답을 반환하지 않았습니다. (${response.status})`
            );

          }

          if (
            !response.ok ||
            data.error
          ) {

            throw new Error(
              data.error ||
              `서버 에러 (${response.status})`
            );

          }

          loadingMessage.innerText =
            data.answer ||
            '답변을 가져올 수 없습니다.';

          appendRetrievalInfo(
            loadingMessage,
            data
          );

        } catch (
          error
        ) {

          loadingMessage.innerText =
            '❌ 오류가 발생했습니다: ' +
            (
              error?.message ||
              '알 수 없는 오류'
            );

        } finally {

          sendButton.disabled =
            false;

          userInput.focus();

        }

      }
    );

    /**
     * ------------------------------------------------------------------------
     * 설정창 열기
     * ------------------------------------------------------------------------
     */

    openSettingsBtn.addEventListener(
      'click',
      () => {

        loadSettingsToUI();

        modal.classList.add(
          'active'
        );

      }
    );

    /**
     * ------------------------------------------------------------------------
     * 설정창 닫기
     * ------------------------------------------------------------------------
     */

    closeModalBtn.addEventListener(
      'click',
      () => {

        modal.classList.remove(
          'active'
        );

      }
    );

    /**
     * ------------------------------------------------------------------------
     * 바깥 영역 클릭 닫기
     * ------------------------------------------------------------------------
     */

    modal.addEventListener(
      'click',
      (
        event
      ) => {

        if (
          event.target ===
          modal
        ) {

          modal.classList.remove(
            'active'
          );

        }

      }
    );

    /**
     * ------------------------------------------------------------------------
     * 설정 저장
     * ------------------------------------------------------------------------
     */

    saveSettingsBtn.addEventListener(
      'click',
      () => {

        const systemPrompt =
          document
            .getElementById(
              'cfg-system-prompt'
            )
            .value
            .trim();

        if (!systemPrompt) {

          alert(
            '시스템 프롬프트를 입력해주세요.'
          );

          return;

        }

        if (
          systemPrompt.length >
          30000
        ) {

          alert(
            '시스템 프롬프트는 30,000자 이하로 입력해주세요.'
          );

          return;

        }

        const selectedRadio =
          document.querySelector(
            'input[name="cfg-model"]:checked'
          );

        const topK =
          parseInt(
            document
              .getElementById(
                'cfg-topk'
              )
              .value,
            10
          );

        const distanceThreshold =
          parseFloat(
            document
              .getElementById(
                'cfg-distance'
              )
              .value
          );

        const newConfig = {

          systemPrompt,

          model:
            selectedRadio?.value ||
            DEFAULT_CONFIG.model,

          topK:
            Number.isFinite(
              topK
            ) &&
            topK >= 1 &&
            topK <= 10
              ? topK
              : DEFAULT_CONFIG.topK,

          distanceThreshold:
            Number.isFinite(
              distanceThreshold
            ) &&
            distanceThreshold >= 0 &&
            distanceThreshold <= 2
              ? distanceThreshold
              : DEFAULT_CONFIG.distanceThreshold

        };

        saveConfig(
          newConfig
        );

        updateHeaderBadge(
          newConfig.model
        );

        modal.classList.remove(
          'active'
        );

      }
    );

    /**
     * ------------------------------------------------------------------------
     * 초기화
     * ------------------------------------------------------------------------
     */

    loadSettingsToUI();

  </script>

</body>

</html>
